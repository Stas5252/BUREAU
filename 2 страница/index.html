<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bureau | Premium Events</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bureau: '#1d2ae6',
                        dark: '#030303'
                    }
                }
            }
        }
    </script>
    <style>
        /* Инициализация базовой физики среды */
        body {
            background-color: #030303;
            color: #f5f5f5;
            margin: 0;
            overflow-x: hidden;
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #030303;
        }
        ::-webkit-scrollbar-thumb {
            background: #1d2ae6;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2a38ff;
        }

        /* Контейнеры для параллакса и масок */
        .img-wrapper {
            position: relative;
            overflow: hidden;
            will-change: transform, clip-path;
        }
        
        .img-wrapper img {
            width: 100%;
            height: 120%;
            object-fit: cover;
            position: absolute;
            top: -10%;
            left: 0;
            will-change: transform;
        }

        /* Пропорции для асимметричной сетки */
        .aspect-portrait { aspect-ratio: 3/4; }
        .aspect-landscape { aspect-ratio: 16/9; }
        .aspect-square { aspect-ratio: 1/1; }

        /* ═══ Типографика описания мероприятия ═══ */
        .event-title {
            font-family: 'PT Serif', Georgia, serif;
            font-weight: 400;
            font-size: clamp(2rem, 6vw, 4.5rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.95);
            line-height: 1.1;
        }

        .event-description {
            max-width: 680px;
            margin: 0 auto;
        }

        .event-description p {
            font-family: 'PT Serif', Georgia, serif;
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            font-weight: 400;
            line-height: 1.9;
            color: rgba(245, 245, 245, 0.55);
            margin-bottom: 1.6em;
            text-align: center;
        }

        .event-description p:last-child {
            margin-bottom: 0;
        }

        /* Акцентный первый абзац */
        .event-description p:first-child {
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            color: rgba(245, 245, 245, 0.7);
            font-style: italic;
        }

        /* Короткие абзацы (одно предложение) — крупнее и акцентнее */
        .event-description p.accent-line {
            font-size: clamp(1.15rem, 2.6vw, 1.5rem);
            color: rgba(245, 245, 245, 0.75);
            font-style: italic;
            margin-top: 2em;
            margin-bottom: 2em;
        }

        /* Разделитель между мероприятиями */
        .event-divider {
            width: 60px;
            height: 1px;
            background: #1d2ae6;
            margin: 0 auto;
        }

        /* Декоративная линия под заголовком */
        .title-line {
            width: 40px;
            height: 1px;
            background: rgba(29, 42, 230, 0.6);
            margin: 1.5rem auto 0;
        }

    </style>
</head>
<body class="antialiased selection:bg-bureau selection:text-white">

    <!-- Hero Section (Главный экран) -->
    <section class="h-screen flex flex-col justify-center items-center px-6 md:px-12 relative z-10">
        <img src="logo.png" alt="Bureau" class="w-auto h-auto max-w-[90vw] max-h-[50vh] object-contain">
    </section>

    <!-- Контейнер мероприятий — заполняется из events.json -->
    <div id="eventsContainer"></div>

    <!-- GSAP, ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <script>
    (function() {
        // ═══════════════════════════════════════
        // Утилита для создания фото-элемента
        // ═══════════════════════════════════════
        function photoEl(src, classes) {
            if (!src) return '';
            return `<div class="img-wrapper ${classes}"><img src="${src}" alt="" loading="lazy"></div>`;
        }

        // ═══════════════════════════════════════
        // Рендер описания — разбивает на абзацы,
        // короткие строки делает акцентными
        // ═══════════════════════════════════════
        function renderDescription(text) {
            if (!text) return '';
            const paragraphs = text.split('\n').filter(p => p.trim());
            return paragraphs.map((p, i) => {
                const isShort = p.trim().length < 60;
                const cls = (isShort && i > 0) ? ' class="accent-line"' : '';
                return `<p${cls}>${escHtml(p.trim())}</p>`;
            }).join('');
        }

        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // ═══════════════════════════════════════
        // 6 шаблонов раскладки (циклически)
        // ═══════════════════════════════════════
        function layout1(photos) {
            return `
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-12">
                <div class="md:col-span-5 md:col-start-2">
                    ${photoEl(photos[0], 'aspect-portrait rounded-sm')}
                    ${photos[1] ? photoEl(photos[1], 'aspect-square rounded-sm mt-8 w-3/4 md:ml-auto') : ''}
                </div>
                <div class="md:col-span-5 flex flex-col gap-4 md:gap-12 md:mt-32">
                    ${photos[2] ? photoEl(photos[2], 'aspect-square rounded-sm') : ''}
                    ${photos[3] ? photoEl(photos[3], 'aspect-landscape rounded-sm') : ''}
                </div>
            </div>`;
        }

        function layout2(photos) {
            return `
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-12">
                <div class="md:col-span-10 md:col-start-2">
                    ${photoEl(photos[0], 'aspect-landscape rounded-sm')}
                </div>
                <div class="md:col-span-4 md:col-start-3">
                    ${photos[1] ? photoEl(photos[1], 'aspect-portrait rounded-sm') : ''}
                </div>
                <div class="md:col-span-4 md:mt-24 flex flex-col gap-12">
                    ${photos[2] ? photoEl(photos[2], 'aspect-portrait rounded-sm') : ''}
                    ${photos[3] ? photoEl(photos[3], 'aspect-square rounded-sm') : ''}
                </div>
            </div>`;
        }

        function layout3(photos) {
            return `
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-12 items-center">
                <div class="md:col-span-4 md:col-start-2">
                    ${photoEl(photos[0], 'aspect-portrait rounded-sm')}
                    ${photos[1] ? photoEl(photos[1], 'aspect-square rounded-sm mt-12 w-4/5') : ''}
                </div>
                <div class="md:col-span-6">
                    ${photos[2] ? photoEl(photos[2], 'aspect-square rounded-sm mb-8') : ''}
                    ${photos[3] ? photoEl(photos[3], 'aspect-landscape rounded-sm md:w-3/4 md:ml-auto') : ''}
                </div>
            </div>`;
        }

        function layout4(photos) {
            return `
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-12">
                <div class="md:col-span-8 md:col-start-3 mb-8">
                    ${photoEl(photos[0], 'aspect-landscape rounded-sm')}
                </div>
                <div class="md:col-span-5 md:col-start-2">
                    ${photos[1] ? photoEl(photos[1], 'aspect-square rounded-sm') : ''}
                </div>
                <div class="md:col-span-4 md:mt-32 flex flex-col gap-12">
                    ${photos[2] ? photoEl(photos[2], 'aspect-portrait rounded-sm') : ''}
                    ${photos[3] ? photoEl(photos[3], 'aspect-square rounded-sm') : ''}
                </div>
            </div>`;
        }

        function layout5(photos) {
            return `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-10">
                <div class="md:mt-20 flex flex-col gap-8">
                    ${photoEl(photos[0], 'aspect-portrait rounded-sm')}
                    ${photos[1] ? photoEl(photos[1], 'aspect-square rounded-sm w-2/3 ml-auto') : ''}
                </div>
                <div class="flex flex-col gap-8">
                    ${photos[2] ? photoEl(photos[2], 'aspect-portrait rounded-sm') : ''}
                    ${photos[3] ? photoEl(photos[3], 'aspect-landscape rounded-sm') : ''}
                </div>
                <div class="md:mt-40 flex flex-col gap-8">
                    ${photos[4] ? photoEl(photos[4], 'aspect-portrait rounded-sm') : ''}
                </div>
            </div>`;
        }

        function layout6(photos) {
            return `
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-12">
                <div class="md:col-span-6 md:col-start-4 relative z-10">
                    ${photoEl(photos[0], 'aspect-portrait rounded-sm')}
                </div>
                <div class="md:col-span-4 md:col-start-2 md:-mt-48 relative z-0">
                    ${photos[1] ? photoEl(photos[1], 'aspect-square rounded-sm opacity-80 hover:opacity-100 transition-opacity') : ''}
                </div>
                <div class="md:col-span-4 md:col-start-8 md:-mt-24 relative z-20">
                    ${photos[2] ? photoEl(photos[2], 'aspect-landscape rounded-sm') : ''}
                    ${photos[3] ? photoEl(photos[3], 'aspect-square rounded-sm mt-12 w-2/3 ml-auto') : ''}
                </div>
            </div>`;
        }

        const LAYOUTS = [
            { fn: layout1, slots: 4 },
            { fn: layout2, slots: 4 },
            { fn: layout3, slots: 4 },
            { fn: layout4, slots: 4 },
            { fn: layout5, slots: 5 },
            { fn: layout6, slots: 4 },
        ];

        // ═══════════════════════════════════════
        // Рендеринг мероприятий
        // ═══════════════════════════════════════
        function renderEvents(events) {
            const container = document.getElementById('eventsContainer');
            let html = '';

            events.forEach((event, eventIdx) => {
                // Заголовок и описание мероприятия
                html += `
                <section class="py-20 md:py-40 px-6 md:px-12 max-w-[1400px] mx-auto">
                    <div class="mb-24 text-center section-title">
                        <h2 class="event-title">${escHtml(event.title || 'Bureau')}</h2>
                        <div class="title-line"></div>
                    </div>
                    ${event.description ? `
                    <div class="event-description section-title">
                        ${renderDescription(event.description)}
                    </div>` : ''}
                </section>`;

                // Фото-галерея
                const photos = event.photos || [];
                let photoIdx = 0;
                let layoutIdx = 0;

                while (photoIdx < photos.length) {
                    const layout = LAYOUTS[layoutIdx % LAYOUTS.length];
                    const chunk = photos.slice(photoIdx, photoIdx + layout.slots);
                    const isLast = (photoIdx + layout.slots >= photos.length) && (eventIdx === events.length - 1);

                    html += `
                    <section class="py-8 md:py-16 px-4 md:px-12 max-w-[1400px] mx-auto ${isLast ? 'mb-32' : ''}">
                        ${layout.fn(chunk)}
                    </section>`;

                    photoIdx += layout.slots;
                    layoutIdx++;
                }

                // Разделитель между мероприятиями
                if (eventIdx < events.length - 1) {
                    html += `
                    <div class="py-20 md:py-32 flex justify-center section-title">
                        <div class="event-divider"></div>
                    </div>`;
                }
            });

            container.innerHTML = html;
        }

        // ═══════════════════════════════════════
        // GSAP анимации (оригинальные)
        // ═══════════════════════════════════════
        function initAnimations() {
            if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
            gsap.registerPlugin(ScrollTrigger);
            ScrollTrigger.getAll().forEach(t => t.kill());

            // Анимация фото
            const wrappers = gsap.utils.toArray('.img-wrapper');
            wrappers.forEach(wrapper => {
                const img = wrapper.querySelector('img');
                if (!img) return;

                gsap.set(wrapper, { clipPath: 'polygon(0 100%, 100% 100%, 100% 100%, 0 100%)' });
                gsap.set(img, { scale: 1.2 });

                let tl = gsap.timeline({
                    scrollTrigger: {
                        trigger: wrapper,
                        start: 'top 85%',
                        toggleActions: 'play none none reverse'
                    }
                });

                tl.to(wrapper, {
                    clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
                    duration: 1.5,
                    ease: 'power4.inOut'
                });

                tl.to(img, {
                    scale: 1,
                    duration: 1.5,
                    ease: 'power4.inOut'
                }, '<');

                gsap.to(img, {
                    yPercent: 15,
                    ease: 'none',
                    scrollTrigger: {
                        trigger: wrapper,
                        start: 'top bottom',
                        end: 'bottom top',
                        scrub: true
                    }
                });
            });

            // Анимация заголовков и описаний
            const titles = gsap.utils.toArray('.section-title');
            titles.forEach(title => {
                gsap.fromTo(title,
                    { opacity: 0, y: 40 },
                    {
                        opacity: 1, y: 0,
                        duration: 1.4,
                        ease: 'power3.out',
                        scrollTrigger: {
                            trigger: title,
                            start: 'top 90%'
                        }
                    }
                );
            });

            ScrollTrigger.refresh();
        }

        // ═══════════════════════════════════════
        // FALLBACK DATA
        // ═══════════════════════════════════════
        const FALLBACK_EVENTS = [
            {
                id: 'event-001',
                title: 'EGGsactly Love',
                description: 'Иногда концепция рождается не на мудборде, а за завтраком.\n\nПеред одним из самых важных собеседований Даня собирался выходить из дома. Лиза приготовила ему яичницу, и одно из яиц оказалось с двумя желтками. Для кого-то — случайность. Для них — знак.\n\nТак родилась идея свадьбы.',
                date: '2026-01-01',
                photos: [
                    'DSC_1726.JPG','DSC_1785.JPG','DSC_1803.JPG','DSC_1824.JPG',
                    'DSC_1853.JPG','DSC_1855.JPG','DSC_1862.JPG','DSC_1875.JPG',
                    'DSC_1894.JPG','DSC_1923.JPG','DSC_1939.JPG','DSC_1954.JPG',
                    'DSC_1972.JPG','DSC_1978.JPG','DSC_1979.JPG','DSC_1988.JPG',
                    'DSC_2021.JPG','DSC_2081.JPG'
                ]
            }
        ];

        // ═══════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════
        document.addEventListener('DOMContentLoaded', async () => {
            let events = FALLBACK_EVENTS;

            try {
                const resp = await fetch('events.json?t=' + Date.now());
                if (resp.ok) {
                    const json = await resp.json();
                    if (json.events && json.events.length > 0) {
                        events = json.events;
                    }
                }
            } catch (e) {
                console.warn('events.json not available, using fallback');
            }

            renderEvents(events);
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    initAnimations();
                });
            });
        });
    })();
    </script>
</body>
</html>
