<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bureau — Админка</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #08080e; --surface: #101018; --card: #16161f;
            --border: rgba(255,255,255,0.07); --text: #e0e0ec;
            --dim: rgba(255,255,255,0.45); --accent: #1d2ae6;
            --accent-glow: rgba(29,42,230,0.25); --success: #22c55e;
            --error: #ef4444; --font: 'Inter', sans-serif;
            --warn: #f59e0b;
        }
        body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

        /* Login */
        .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 48px 40px; max-width: 420px; width: 100%; text-align: center;
        }
        .login-card h1 { font-size: 28px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 6px; }
        .login-card p { color: var(--dim); font-size: 14px; margin-bottom: 32px; }
        .login-card input {
            width: 100%; padding: 14px 16px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 10px;
            color: var(--text); font-family: var(--font); font-size: 14px;
            outline: none; margin-bottom: 16px;
        }
        .login-card input:focus { border-color: rgba(29,42,230,0.5); }
        .login-card input::placeholder { color: var(--dim); }
        .login-err { color: var(--error); font-size: 13px; margin-top: 8px; display: none; }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 28px; font-family: var(--font); font-size: 13px;
            font-weight: 600; border: none; border-radius: 999px; cursor: pointer;
            transition: all 0.25s; width: 100%;
        }
        .btn-go { background: var(--accent); color: #fff; box-shadow: 0 4px 20px var(--accent-glow); }
        .btn-go:hover { background: #2a38ff; transform: translateY(-1px); }
        .btn-go:disabled { opacity: 0.5; cursor: wait; transform: none; }
        .btn-out {
            background: transparent; color: var(--dim); border: 1px solid var(--border);
            width: auto; padding: 8px 20px; font-size: 12px;
        }
        .btn-out:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
        .btn-add {
            background: var(--accent); color: #fff; border: none; border-radius: 999px;
            padding: 10px 24px; font-family: var(--font); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.25s; display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-add:hover { background: #2a38ff; transform: translateY(-1px); }
        .btn-del-event {
            background: transparent; color: var(--error); border: 1px solid rgba(239,68,68,0.3);
            border-radius: 999px; padding: 7px 18px; font-family: var(--font); font-size: 11px;
            font-weight: 600; cursor: pointer; transition: all 0.25s;
        }
        .btn-del-event:hover { background: var(--error); color: #fff; border-color: var(--error); }
        .btn-save {
            background: var(--success); color: #fff; border: none; border-radius: 999px;
            padding: 7px 18px; font-family: var(--font); font-size: 11px;
            font-weight: 600; cursor: pointer; transition: all 0.25s;
        }
        .btn-save:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .btn-save:disabled { opacity: 0.5; cursor: wait; transform: none; }
        .btn-move {
            background: transparent; color: var(--dim); border: 1px solid var(--border);
            border-radius: 999px; padding: 5px 10px; font-family: var(--font); font-size: 11px;
            cursor: pointer; transition: all 0.2s; line-height: 1;
        }
        .btn-move:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
        .btn-move:disabled { opacity: 0.2; cursor: default; }

        .spinner {
            width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Main */
        .main { display: none; }
        .main.on { display: block; }
        .topbar {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
        }
        .topbar h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; }
        .topbar h1 span { color: var(--accent); }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .topbar-ok { font-size: 11px; color: var(--success); display: flex; align-items: center; gap: 6px; }
        .topbar-ok::before { content: ''; width: 6px; height: 6px; background: var(--success); border-radius: 50%; }

        .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }

        /* Add event area */
        .add-area { text-align: center; margin-bottom: 32px; }

        /* Event card */
        .evt {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; margin-bottom: 28px; overflow: hidden;
            transition: border-color 0.3s;
        }
        .evt:hover { border-color: rgba(255,255,255,0.12); }
        .evt-head {
            padding: 18px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .evt-head-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .evt-num {
            font-size: 11px; font-weight: 700; color: var(--accent);
            background: var(--accent-glow); border-radius: 6px;
            padding: 4px 8px; letter-spacing: 0.05em; flex-shrink: 0;
        }
        .evt-head h2 {
            font-size: 14px; font-weight: 600; letter-spacing: 0.03em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .evt-head-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        /* Event fields */
        .evt-fields { padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .evt-field { margin-bottom: 14px; }
        .evt-field:last-child { margin-bottom: 0; }
        .evt-field label {
            display: block; font-size: 11px; font-weight: 600; color: var(--dim);
            text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px;
        }
        .evt-field .hint {
            font-size: 10px; color: rgba(255,255,255,0.25); font-weight: 400;
            text-transform: none; letter-spacing: normal; margin-left: 8px;
        }
        .evt-field input, .evt-field textarea {
            width: 100%; padding: 10px 14px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); font-family: var(--font); font-size: 13px;
            outline: none; transition: border-color 0.2s;
        }
        .evt-field input:focus, .evt-field textarea:focus { border-color: rgba(29,42,230,0.5); }
        .evt-field textarea {
            resize: vertical; min-height: 160px; line-height: 1.7;
            font-size: 13px;
        }

        /* Индикатор несохранённых изменений */
        .pending-box { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
        .pending-box.on { color: var(--warn); }
        .pending-ok { color: var(--dim); font-size: 11px; }
        .pending-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex-shrink: 0; animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: 0.3; } }
        .btn-publish {
            background: var(--success); color: #fff; border: none; border-radius: 999px;
            padding: 7px 18px; font-family: var(--font); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all 0.25s; white-space: nowrap;
        }
        .btn-publish:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-publish:disabled { opacity: 0.5; cursor: wait; transform: none; }

        /* Бейдж «новое» на ещё не сохранённом фото */
        .ph-new {
            position: absolute; bottom: 5px; left: 5px; background: var(--warn);
            color: #000; font-size: 9px; font-weight: 700; padding: 2px 7px;
            border-radius: 999px; letter-spacing: 0.04em; text-transform: uppercase;
        }

        /* Photo count badge */
        .photo-badge {
            font-size: 11px; color: var(--dim); background: var(--bg);
            padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
        }

        /* Обложка мероприятия */
        .cover-row {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 20px; border-bottom: 1px solid var(--border);
        }
        .cover-thumb {
            width: 120px; height: 80px; border-radius: 8px; overflow: hidden;
            background: var(--bg); flex-shrink: 0; position: relative;
            border: 1px solid var(--border);
        }
        .cover-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .cover-empty {
            width: 100%; height: 100%; display: grid; place-items: center;
            color: rgba(255,255,255,0.2); font-size: 22px;
        }
        .cover-info { flex: 1; min-width: 0; }
        .cover-info label {
            display: block; font-size: 11px; font-weight: 600; color: var(--dim);
            text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px;
        }
        .cover-info p { font-size: 11px; color: rgba(255,255,255,0.28); line-height: 1.5; }
        .cover-btns { display: flex; gap: 8px; flex-shrink: 0; }
        .btn-cover {
            background: transparent; color: var(--accent); border: 1px solid rgba(29,42,230,0.4);
            border-radius: 999px; padding: 7px 16px; font-family: var(--font);
            font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.25s; white-space: nowrap;
        }
        .btn-cover:hover { background: var(--accent); color: #fff; }
        .btn-cover.rm { color: var(--error); border-color: rgba(239,68,68,0.3); }
        .btn-cover.rm:hover { background: var(--error); color: #fff; }
        @media (max-width: 640px) {
            .cover-row { flex-wrap: wrap; }
            .cover-info { flex-basis: calc(100% - 134px); }
            .cover-btns { width: 100%; justify-content: flex-end; }
        }

        /* Photo grid */
        .photos {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 6px; padding: 14px;
        }
        .photos:empty::after {
            content: 'Нет фото — загрузите первые снимки'; display: block; text-align: center;
            color: var(--dim); font-size: 13px; padding: 24px; grid-column: 1/-1;
        }
        .ph {
            position: relative; aspect-ratio: 1; border-radius: 8px;
            overflow: hidden; background: var(--bg);
        }
        .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .ph-placeholder {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            color: var(--dim); font-size: 24px; background: var(--bg);
        }
        .ph-x {
            position: absolute; top: 5px; right: 5px; width: 22px; height: 22px;
            background: rgba(0,0,0,0.75); color: #fff; border: none; border-radius: 50%;
            font-size: 11px; cursor: pointer; display: grid; place-items: center;
            opacity: 0; transition: opacity 0.2s;
        }
        .ph:hover .ph-x { opacity: 1; }
        .ph-x:hover { background: var(--error); }

        /* Upload */
        .up {
            margin: 6px 14px 14px; border: 2px dashed var(--border); border-radius: 12px;
            padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s;
            font-size: 13px; color: var(--dim);
        }
        .up:hover, .up.over { border-color: var(--accent); background: var(--accent-glow); }
        .up strong { color: var(--accent); }
        .up input { display: none; }
        .up-hint { font-size: 11px; color: rgba(255,255,255,0.2); margin-top: 6px; }
        .bar { height: 3px; background: var(--border); margin: 0 14px 10px; border-radius: 2px; overflow: hidden; display: none; }
        .bar.on { display: block; }
        .bar-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.3s; border-radius: 2px; }

        /* Toast */
        .toasts { position: fixed; top: 64px; right: 16px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            padding: 10px 18px; background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            animation: tin 0.3s ease;
        }
        .toast.ok { border-left: 3px solid var(--success); }
        .toast.err { border-left: 3px solid var(--error); }
        .toast.out { animation: tout 0.3s ease forwards; }
        @keyframes tin { from { opacity: 0; transform: translateX(30px); } }
        @keyframes tout { to { opacity: 0; transform: translateX(30px); } }

        /* Confirm */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .overlay.on { display: flex; }
        .dialog {
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
            padding: 28px; max-width: 400px; width: 100%;
        }
        .dialog h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .dialog p { font-size: 13px; color: var(--dim); margin-bottom: 20px; line-height: 1.5; }
        .dialog-btns { display: flex; gap: 10px; justify-content: flex-end; }
        .dialog-btns button { padding: 8px 20px; border-radius: 999px; font-family: var(--font); font-size: 12px; font-weight: 600; cursor: pointer; border: none; }
        .dbtn-no { background: transparent; color: var(--dim); border: 1px solid var(--border); }
        .dbtn-no:hover { color: var(--text); }
        .dbtn-yes { background: var(--error); color: #fff; }
        .dbtn-yes:hover { filter: brightness(1.1); }

        /* Empty state */
        .empty-state {
            text-align: center; padding: 60px 20px; color: var(--dim);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
        .empty-state p { font-size: 14px; margin-bottom: 24px; }

        @media (max-width: 640px) {
            .login-card { padding: 32px 24px; }
            .photos { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
            .evt-head { flex-direction: column; align-items: flex-start; gap: 10px; }
            .evt-head-right { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
    <div class="login-card">
        <h1>BUREAU</h1>
        <p>Вставьте GitHub-токен для входа</p>
        <input type="password" id="tok" placeholder="ghp_xxxxxxxxxxxx">
        <button class="btn btn-go" id="goBtn" onclick="go()">Войти</button>
        <div class="login-err" id="err"></div>
    </div>
</div>

<!-- MAIN -->
<div class="main" id="main">
    <div class="topbar">
        <h1><span>BUREAU</span> АДМИНКА</h1>
        <div class="topbar-right">
            <div class="pending-box" id="pendingBox"></div>
            <div class="topbar-ok" id="status"></div>
            <button class="btn-out" onclick="out()">Выйти</button>
        </div>
    </div>
    <div class="wrap" id="wrap"></div>
</div>

<div class="toasts" id="toasts"></div>
<div class="overlay" id="ov"><div class="dialog" id="dlg"></div></div>

<script>
// ═══ CONFIG ═══
let cfg = { token:'', owner:'', repo:'', branch:'main', base:'2 страница' };
let data = null;
let sha = null;
// Локальные превью только что загруженных фото (data-URL), чтобы показать
// картинку сразу, не дожидаясь появления файла на raw.githubusercontent CDN
const localPreviews = {};

// ═══ НЕСОХРАНЁННЫЕ ИЗМЕНЕНИЯ ═══
// Всё копится здесь и уходит на GitHub ОДНИМ коммитом по кнопке «Сохранить».
// Так одна загрузка из 30 фото = 1 сборка сайта, а не 31 (иначе GitHub
// начинает душить аккаунт и деплой встаёт на часы).
let pending = { adds: {}, dels: [], dirty: false };

function markDirty() { pending.dirty = true; updatePendingUI(); }

function pendingCount() {
    return Object.keys(pending.adds).length + pending.dels.length + (pending.dirty ? 1 : 0);
}
function hasPending() { return pendingCount() > 0; }

function updatePendingUI() {
    const box = document.getElementById('pendingBox');
    if (!box) return;
    const nAdd = Object.keys(pending.adds).length;
    const nDel = pending.dels.length;
    if (!hasPending()) {
        box.className = 'pending-box';
        box.innerHTML = '<span class="pending-ok">Всё сохранено</span>';
        return;
    }
    const parts = [];
    if (nAdd) parts.push(nAdd + ' фото');
    if (nDel) parts.push('удалено ' + nDel);
    if (pending.dirty && !parts.length) parts.push('правки текста');
    box.className = 'pending-box on';
    box.innerHTML = `<span class="pending-dot"></span><span>Не сохранено: ${parts.join(', ')}</span>
        <button class="btn-publish" id="publishBtn" onclick="publish()">Сохранить</button>`;
}

// Предупреждение при закрытии вкладки с несохранёнными правками
window.addEventListener('beforeunload', e => {
    if (hasPending()) { e.preventDefault(); e.returnValue = ''; }
});

// ═══ GITHUB API ═══
function apiUrl(p) {
    return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p.split('/').map(encodeURIComponent).join('/')}`;
}
function hdr() {
    return { 'Authorization':'token '+cfg.token, 'Content-Type':'application/json', 'Accept':'application/vnd.github.v3+json' };
}

async function getFile(p) {
    // no-store + cache-bust: GitHub API отдаёт Cache-Control max-age=60,
    // из-за чего браузер иначе показывает устаревший файл и старый sha
    const r = await fetch(apiUrl(p) + '?t=' + Date.now(), {headers:hdr(), cache:'no-store'});
    if (r.status===404) return null;
    if (!r.ok) throw new Error('GitHub '+r.status);
    const d = await r.json();
    return { text: decodeURIComponent(escape(atob(d.content.replace(/\n/g,'')))), sha: d.sha };
}

async function putText(p, text, msg, s) {
    const b = { message:msg, content:btoa(unescape(encodeURIComponent(text))), branch:cfg.branch };
    if (s) b.sha = s;
    const r = await fetch(apiUrl(p), {method:'PUT', headers:hdr(), body:JSON.stringify(b)});
    if (!r.ok) throw new Error('PUT '+r.status);
    return r.json();
}

// ═══ GIT DATA API — один коммит на любое число файлов ═══
// Blob'ы сами по себе коммитов не создают, поэтому сколько бы фото ни было,
// сборка сайта запускается ровно один раз (в самом конце, на updateRef).
function gitUrl(sub) {
    return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/git/${sub}`;
}

async function gitReq(sub, method, body) {
    const o = { method, headers: hdr(), cache: 'no-store' };
    if (body) o.body = JSON.stringify(body);
    const url = gitUrl(sub) + (method === 'GET' ? '?t=' + Date.now() : '');
    const r = await fetch(url, o);
    if (!r.ok) {
        let detail = '';
        try { detail = (await r.json()).message || ''; } catch(e) {}
        const err = new Error('GitHub ' + r.status + (detail ? ': ' + detail : ''));
        err.status = r.status;
        throw err;
    }
    return r.json();
}

async function createBlob(b64) {
    const d = await gitReq('blobs', 'POST', { content: b64, encoding: 'base64' });
    return d.sha;
}

function textToB64(text) { return btoa(unescape(encodeURIComponent(text))); }

// files: [{path, b64}] — добавить/заменить; deletions: [path] — удалить
async function commitBatch(message, files, deletions) {
    const ref = await gitReq('ref/heads/' + cfg.branch, 'GET');
    const headSha = ref.object.sha;
    const headCommit = await gitReq('commits/' + headSha, 'GET');

    const tree = [];
    for (const f of files) {
        const sha = await createBlob(f.b64);
        tree.push({ path: f.path, mode: '100644', type: 'blob', sha });
    }
    for (const p of deletions) {
        tree.push({ path: p, mode: '100644', type: 'blob', sha: null });
    }
    if (!tree.length) return null;

    const newTree = await gitReq('trees', 'POST', { base_tree: headCommit.tree.sha, tree });
    const commit = await gitReq('commits', 'POST', {
        message, tree: newTree.sha, parents: [headSha]
    });
    await gitReq('refs/heads/' + cfg.branch, 'PATCH', { sha: commit.sha });
    return commit.sha;
}

// ═══ DATA ═══
function jp() { return cfg.base+'/events.json'; }

function photoUrl(path) {
    if (localPreviews[path]) return localPreviews[path];
    if (!cfg.owner || !cfg.repo) return path;
    return `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${encodeURIComponent(cfg.base)}/${path.split('/').map(encodeURIComponent).join('/')}?t=${Date.now()}`;
}

// Повторные попытки загрузить фото — свежий файл на raw.githubusercontent
// CDN может появиться с задержкой в несколько секунд после коммита
function retryImg(img) {
    const n = parseInt(img.dataset.n || '0', 10);
    if (n >= 4) {
        img.outerHTML = '<div class="ph-placeholder">🖼</div>';
        return;
    }
    img.dataset.n = n + 1;
    const p = img.dataset.path;
    setTimeout(() => {
        img.src = photoUrl(p) + (photoUrl(p).indexOf('?') >= 0 ? '&' : '?') + 'r=' + Date.now();
    }, 1500 * (n + 1));
}

function getEvent(eventId) {
    let evt = data.events.find(e => e.id === eventId);
    if (!evt) {
        evt = { id: eventId, title: '', description: '', date: '', photos: [] };
        data.events.push(evt);
    }
    return evt;
}

async function load() {
    const f = await getFile(jp());
    if (f) {
        data = JSON.parse(f.text);
        sha = f.sha;
    } else {
        // Файла нет — пробуем создать. Если и это не выходит, значит выбран
        // не тот репозиторий (пустой/чужой) или у токена нет прав на запись.
        // Раньше здесь наружу летело невнятное «PUT 404».
        data = { events: [] };
        try {
            const r = await putText(jp(), JSON.stringify(data,null,2), 'Init events.json', null);
            sha = r.content.sha;
        } catch(e) {
            throw new Error(
                'В репозитории ' + cfg.owner + '/' + cfg.repo + ' нет файла «' + jp() + '», ' +
                'и создать его не удалось. Обычно это значит, что выбран не тот репозиторий ' +
                '(например, пустой) или у токена нет прав на запись.'
            );
        }
    }
}

// Пишем текст в data сразу при наборе. Без этого любая перерисовка
// (например, после загрузки фото) восстанавливала поля из data и стирала
// только что набранный, ещё не сохранённый текст.
function onFieldInput(el) {
    const isTitle = el.id.indexOf('title-') === 0;
    const evtId = el.id.slice(isTitle ? 6 : 5);
    const evt = data.events.find(e => e.id === evtId);
    if (evt) {
        if (isTitle) evt.title = el.value;
        else evt.description = el.value;
    }
    markDirty();
}

// Забираем текст из полей ввода в data (поля не привязаны реактивно),
// иначе несохранённые правки других мероприятий потерялись бы при публикации
function syncInputs() {
    data.events.forEach(evt => {
        const t = document.getElementById('title-' + evt.id);
        const d = document.getElementById('desc-' + evt.id);
        if (t) evt.title = t.value;
        if (d) evt.description = d.value;
    });
}

// ═══ ПУБЛИКАЦИЯ: всё накопленное уходит ОДНИМ коммитом ═══
async function publish() {
    syncInputs();
    if (!hasPending()) { toast('Нечего сохранять', 'ok'); return; }

    const btn = document.getElementById('publishBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Сохраняю...'; }

    // Снимок на случай ошибки — чтобы ничего не потерялось и можно было повторить
    const addsSnapshot = Object.assign({}, pending.adds);
    const delsSnapshot = pending.dels.slice();

    const files = [{ path: jp(), b64: textToB64(JSON.stringify(data, null, 2)) }];
    for (const rel in addsSnapshot) {
        files.push({ path: cfg.base + '/' + rel, b64: addsSnapshot[rel] });
    }
    const dels = delsSnapshot.map(rel => cfg.base + '/' + rel);

    const nAdd = Object.keys(addsSnapshot).length;
    const msgParts = [];
    if (nAdd) msgParts.push('+' + nAdd + ' фото');
    if (dels.length) msgParts.push('-' + dels.length + ' фото');
    const msg = 'Обновление сайта' + (msgParts.length ? ' (' + msgParts.join(', ') + ')' : '');

    try {
        try {
            await commitBatch(msg, files, dels);
        } catch(e) {
            // Ветка уехала вперёд (админка с другого устройства) — берём свежий
            // HEAD и повторяем один раз, чтобы правки не потерялись
            if (e.status === 409 || e.status === 422) await commitBatch(msg, files, dels);
            else throw e;
        }
        pending = { adds: {}, dels: [], dirty: false };
        // Локальные превью оставляем: файл на CDN появляется с задержкой
        const f = await getFile(jp());
        if (f) sha = f.sha;
        toast('Сохранено ✓ Сайт обновится за 1–2 мин', 'ok');
    } catch(e) {
        toast('Ошибка: ' + e.message + ' — изменения не потеряны, попробуйте ещё раз', 'err');
    } finally {
        updatePendingUI();
        render();
    }
}

// ═══ LOGIN ═══
async function go() {
    const token = document.getElementById('tok').value.trim();
    if (!token) { errShow('Вставьте токен'); return; }

    const btn = document.getElementById('goBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    errHide();

    try {
        const h = {'Authorization':'token '+token, 'Accept':'application/vnd.github.v3+json'};

        const u = await fetch('https://api.github.com/user', {headers:h});
        if (!u.ok) throw new Error('Неверный токен');

        // Репозиториев со словом «bureau» может быть несколько. Раньше брался
        // первый по дате обновления — и админка уезжала в посторонний (например,
        // свежесозданный пустой) репозиторий, откуда шли 404. Теперь выбираем
        // тот, где реально лежит сайт.
        const rr = await fetch('https://api.github.com/user/repos?per_page=100&sort=updated', {headers:h});
        const all = await rr.json();
        if (!Array.isArray(all)) throw new Error('Не удалось получить список репозиториев');

        const candidates = all.filter(r => r.name.toLowerCase().includes('bureau'));
        if (!candidates.length) throw new Error('Репозиторий с «bureau» не найден');

        const BASE = '2 страница';
        const enc = p => p.split('/').map(encodeURIComponent).join('/');
        const exists = async (r, path) => {
            try {
                const t = await fetch(`https://api.github.com/repos/${r.owner.login}/${r.name}/contents/${enc(path)}`, {headers:h});
                return t.ok;
            } catch(e) { return false; }
        };

        let chosen = null;
        for (const r of candidates) { if (await exists(r, BASE + '/events.json')) { chosen = r; break; } }
        if (!chosen) for (const r of candidates) { if (await exists(r, BASE)) { chosen = r; break; } }
        if (!chosen) chosen = candidates.find(r => r.name.toLowerCase() === 'bureau');
        if (!chosen) {
            throw new Error('Сайт не найден. Подходящие репозитории: ' +
                candidates.map(r => r.name).join(', ') + ' — ни в одном нет папки «' + BASE + '»');
        }

        cfg = { token, owner:chosen.owner.login, repo:chosen.name, branch:chosen.default_branch || 'main', base:BASE };
        await load();
        localStorage.setItem('bt', token);

        document.getElementById('login').style.display = 'none';
        document.getElementById('main').classList.add('on');
        document.getElementById('status').textContent = cfg.owner+'/'+cfg.repo;
        render();
        toast('Подключено','ok');
    } catch(e) {
        errShow(e.message);
    } finally {
        btn.disabled = false; btn.textContent = 'Войти';
    }
}

function out() {
    if (hasPending() && !confirm('Есть несохранённые изменения. Выйти и потерять их?')) return;
    localStorage.removeItem('bt');
    // Чистим состояние и разметку: иначе при повторном входе старые поля
    // могли бы затереть свежие данные, загруженные с GitHub
    pending = { adds: {}, dels: [], dirty: false };
    document.getElementById('wrap').innerHTML = '';
    document.getElementById('main').classList.remove('on');
    document.getElementById('login').style.display = 'flex';
}

function errShow(m) { const e=document.getElementById('err'); e.textContent=m; e.style.display='block'; }
function errHide() { document.getElementById('err').style.display='none'; }

// ═══ ADD EVENT (локально) ═══
function addEvent() {
    syncInputs();
    data.events.push({
        id: 'event-' + Date.now(),
        title: 'Новое мероприятие',
        description: '',
        date: new Date().toISOString().slice(0,10),
        photos: []
    });
    markDirty();
    render();
}

// ═══ MOVE EVENT (локально) ═══
function moveEvent(eventId, direction) {
    syncInputs();
    const idx = data.events.findIndex(e => e.id === eventId);
    if (idx < 0) return;
    const newIdx = idx + direction;
    if (newIdx < 0 || newIdx >= data.events.length) return;

    [data.events[idx], data.events[newIdx]] = [data.events[newIdx], data.events[idx]];
    markDirty();
    render();
}

// ═══ DELETE EVENT ═══
function confirmDelEvent(eventId) {
    const evt = getEvent(eventId);
    document.getElementById('dlg').innerHTML = `
        <h3>Удалить мероприятие?</h3>
        <p><strong>${esc(evt.title)}</strong><br>Все фото мероприятия будут удалены. Это действие нельзя отменить.</p>
        <div class="dialog-btns">
            <button class="dbtn-no" onclick="closeOv()">Отмена</button>
            <button class="dbtn-yes" onclick="delEvent('${eventId}')">Удалить</button>
        </div>`;
    document.getElementById('ov').classList.add('on');
}

function delEvent(eventId) {
    closeOv();
    syncInputs();
    const idx = data.events.findIndex(e => e.id === eventId);
    if (idx < 0) return;

    const evt = data.events[idx];
    // Фото мероприятия и обложку помечаем к удалению (реально удалятся при «Сохранить»)
    evt.photos.forEach(p => queuePhotoDelete(p));
    if (evt.cover) queuePhotoDelete(evt.cover);
    data.events.splice(idx, 1);
    markDirty();
    render();
}

// Пометить фото к удалению. Если оно ещё не загружено на GitHub —
// просто выбрасываем из очереди загрузки, удалять на сервере нечего.
function queuePhotoDelete(rel) {
    if (pending.adds[rel]) {
        delete pending.adds[rel];
        delete localPreviews[rel];
        return;
    }
    if (rel.startsWith('photos/') && pending.dels.indexOf(rel) < 0) pending.dels.push(rel);
}

// ═══ RENDER ═══
function render() {
    const w = document.getElementById('wrap');
    updatePendingUI();

    if (data.events.length === 0) {
        w.innerHTML = `
        <div class="add-area">
            <button class="btn-add" onclick="addEvent()">＋ Добавить мероприятие</button>
        </div>
        <div class="empty-state">
            <div class="icon">📋</div>
            <p>Пока нет мероприятий.<br>Добавьте первое, чтобы начать.</p>
        </div>`;
        return;
    }

    let html = `<div class="add-area">
        <button class="btn-add" onclick="addEvent()">＋ Добавить мероприятие</button>
    </div>`;

    html += data.events.map((evt, i) => {
        const num = String(i + 1).padStart(2, '0');
        const isFirst = i === 0;
        const isLast = i === data.events.length - 1;
        return `
        <div class="evt">
            <div class="evt-head">
                <div class="evt-head-left">
                    <span class="evt-num">${num}</span>
                    <h2>${esc(evt.title || 'Без названия')}</h2>
                </div>
                <div class="evt-head-right">
                    <span class="photo-badge">${evt.photos.length} фото</span>
                    <button class="btn-move" onclick="moveEvent('${evt.id}',-1)" ${isFirst ? 'disabled' : ''} title="Вверх">↑</button>
                    <button class="btn-move" onclick="moveEvent('${evt.id}',1)" ${isLast ? 'disabled' : ''} title="Вниз">↓</button>
                    <button class="btn-save" data-save="${evt.id}" onclick="publish()">Сохранить</button>
                    <button class="btn-del-event" onclick="confirmDelEvent('${evt.id}')">Удалить</button>
                </div>
            </div>
            <div class="evt-fields">
                <div class="evt-field">
                    <label>Название мероприятия</label>
                    <input type="text" id="title-${evt.id}" value="${esc(evt.title || '')}" oninput="onFieldInput(this)" placeholder="Например: EGGsactly Love">
                </div>
                <div class="evt-field">
                    <label>Описание <span class="hint">Каждый абзац с новой строки. Короткие строки станут акцентными.</span></label>
                    <textarea id="desc-${evt.id}" oninput="onFieldInput(this)" placeholder="Расскажите историю мероприятия...\n\nКаждый абзац отделяйте пустой строкой.\n\nКороткие строки будут выделены как акцентные фразы.">${esc(evt.description || '')}</textarea>
                </div>
            </div>
            <div class="cover-row">
                <div class="cover-thumb">
                    ${evt.cover
                        ? `<img src="${photoUrl(evt.cover)}" alt="" data-path="${esc(evt.cover)}" data-n="0" onerror="retryImg(this)">`
                        : `<div class="cover-empty">🖼</div>`}
                </div>
                <div class="cover-info">
                    <label>Обложка ${evt.cover && pending.adds[evt.cover] ? '<span style="color:var(--warn)">• новое</span>' : ''}</label>
                    <p>Крупное фото перед названием мероприятия на сайте.<br>Если не задана — сразу идёт название.</p>
                </div>
                <div class="cover-btns">
                    <button class="btn-cover" onclick="document.getElementById('cf-${evt.id}').click()">${evt.cover ? 'Заменить' : 'Загрузить'}</button>
                    ${evt.cover ? `<button class="btn-cover rm" onclick="delCover('${evt.id}')">Убрать</button>` : ''}
                    <input type="file" id="cf-${evt.id}" accept="image/*" style="display:none" onchange="uploadCover(this.files,'${evt.id}')">
                </div>
            </div>
            <div class="photos" id="ph-${evt.id}">
                ${evt.photos.map(p => `
                    <div class="ph">
                        <img src="${photoUrl(p)}" alt="" loading="lazy" data-path="${esc(p)}" data-n="0" onerror="retryImg(this)">
                        ${pending.adds[p] ? '<span class="ph-new">новое</span>' : ''}
                        <button class="ph-x" onclick="event.stopPropagation();confirmDel('${evt.id}','${esc(p)}')" title="Удалить">✕</button>
                    </div>
                `).join('')}
            </div>
            <div class="bar" id="bar-${evt.id}"><div class="bar-fill" id="bf-${evt.id}"></div></div>
            <div class="up"
                 onclick="document.getElementById('f-${evt.id}').click()"
                 ondragover="event.preventDefault();this.classList.add('over')"
                 ondragleave="this.classList.remove('over')"
                 ondrop="event.preventDefault();this.classList.remove('over');drop(event,'${evt.id}')">
                <strong>Нажмите</strong> или перетащите фото сюда
                <div class="up-hint">JPG, PNG, WebP — сжимаются автоматически, можно прямо с телефона</div>
                <input type="file" id="f-${evt.id}" accept="image/*" multiple onchange="upload(this.files,'${evt.id}')">
            </div>
        </div>`;
    }).join('');

    w.innerHTML = html;
}

// ═══ UPLOAD ═══
function drop(e, eventId) { upload(e.dataTransfer.files, eventId); }

// ═══ ОБЛОЖКА МЕРОПРИЯТИЯ ═══
// Отдельное фото, показывается крупно под названием на сайте.
// Живёт в той же очереди, что и обычные фото — уходит тем же одним коммитом.
async function uploadCover(files, eventId) {
    if (!files || !files.length) return;
    syncInputs();
    const evt = getEvent(eventId);
    const f = files[0];

    if (!f.type.startsWith('image/')) { toast(f.name + ' — не фото', 'err'); return; }
    if (f.size > 25 * 1024 * 1024) { toast(f.name + ' > 25МБ', 'err'); return; }

    try {
        const b64 = await compressImage(f, 1600, 0.75);
        // Кириллица в имени превращалась бы в «______», поэтому такие имена
        // отбрасываем и оставляем просто cover-<метка времени>
        const safe = f.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9._-]/g, '');
        const rel = `photos/${eventId}/cover${safe ? '-' + safe : ''}-${Date.now().toString(36)}.jpg`;

        if (evt.cover) queuePhotoDelete(evt.cover);   // старую обложку убираем
        evt.cover = rel;
        pending.adds[rel] = b64;
        localPreviews[rel] = 'data:image/jpeg;base64,' + b64;
        markDirty();
        toast('Обложка готова — нажмите «Сохранить»', 'ok');
    } catch(e) {
        toast('Ошибка: ' + e.message, 'err');
    }
    render();
    const inp = document.getElementById('cf-' + eventId);
    if (inp) inp.value = '';
}

function delCover(eventId) {
    syncInputs();
    const evt = getEvent(eventId);
    if (!evt.cover) return;
    queuePhotoDelete(evt.cover);
    delete evt.cover;
    markDirty();
    render();
}

// ═══ COMPRESS IMAGE ═══
function compressImage(file, maxWidth, quality) {
    maxWidth = maxWidth || 1600;
    quality = quality || 0.75;
    return new Promise((res, rej) => {
        const reader = new FileReader();
        // Внятные сообщения вместо «Ошибка: undefined»: onerror отдаёт Event,
        // а не Error, и у пользователя не было ни малейшей подсказки
        reader.onerror = () => rej(new Error(file.name + ' — не удалось прочитать файл'));
        reader.onload = () => {
            const img = new Image();
            img.onerror = () => rej(new Error(
                file.name + ' — формат не поддерживается браузером (например HEIC с iPhone). ' +
                'Пересохраните в JPG или отправьте фото прямо с телефона'
            ));
            img.onload = () => {
                let w = img.width, h = img.height;
                if (w > maxWidth) {
                    h = Math.round(h * maxWidth / w);
                    w = maxWidth;
                }
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                const dataUrl = canvas.toDataURL('image/jpeg', quality);
                const b64 = dataUrl.split(',')[1];
                const origKB = Math.round(file.size / 1024);
                const newKB = Math.round(b64.length * 3 / 4 / 1024);
                console.log(`Сжатие: ${file.name} ${origKB}KB → ${newKB}KB (${w}x${h})`);
                res(b64);
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    });
}

async function upload(files, eventId) {
    if (!files || !files.length) return;
    syncInputs();   // текст из полей — в data, иначе render() в конце его затрёт
    const evt = getEvent(eventId);
    const bar = document.getElementById('bar-' + eventId);
    const fill = document.getElementById('bf-' + eventId);
    bar.classList.add('on');

    // Фото только сжимаются и кладутся в очередь — на GitHub они уедут
    // одним коммитом при нажатии «Сохранить»
    let ok = 0;
    for (let i = 0; i < files.length; i++) {
        const f = files[i];
        if (!f.type.startsWith('image/')) { toast(f.name + ' — не фото', 'err'); continue; }
        if (f.size > 25 * 1024 * 1024) { toast(f.name + ' > 25МБ', 'err'); continue; }
        try {
            const b64 = await compressImage(f, 1600, 0.75);
            const safe = f.name.replace(/[^a-zA-Z0-9._-]/g, '_').replace(/\.[^.]+$/, '');
            const baseName = safe + '-' + Date.now().toString(36) + i + '.jpg';
            const rel = `photos/${eventId}/${baseName}`;
            evt.photos.push(rel);
            pending.adds[rel] = b64;
            localPreviews[rel] = 'data:image/jpeg;base64,' + b64;
            ok++;
            fill.style.width = ((i + 1) / files.length * 100) + '%';
        } catch(e) { toast('Ошибка: ' + e.message, 'err'); }
    }

    if (ok > 0) {
        markDirty();
        toast(ok + ' фото готово — нажмите «Сохранить»', 'ok');
    }

    setTimeout(() => { bar.classList.remove('on'); fill.style.width = '0'; }, 800);
    render();
    const inp = document.getElementById('f-' + eventId);
    if (inp) inp.value = '';
}

// ═══ DELETE PHOTO ═══
function confirmDel(eventId, path) {
    document.getElementById('dlg').innerHTML = `
        <h3>Удалить фото?</h3>
        <p>${path.split('/').pop()}</p>
        <div class="dialog-btns">
            <button class="dbtn-no" onclick="closeOv()">Отмена</button>
            <button class="dbtn-yes" onclick="del('${eventId}','${esc(path)}')">Удалить</button>
        </div>`;
    document.getElementById('ov').classList.add('on');
}

function closeOv() { document.getElementById('ov').classList.remove('on'); }

function del(eventId, path) {
    closeOv();
    syncInputs();
    const evt = getEvent(eventId);
    const idx = evt.photos.indexOf(path);
    if (idx < 0) return;
    evt.photos.splice(idx, 1);
    queuePhotoDelete(path);
    markDirty();
    render();
}

// ═══ UTILS ═══
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function toast(m, t) {
    const el = document.createElement('div');
    el.className = 'toast ' + t; el.textContent = m;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 3000);
}

document.getElementById('ov').addEventListener('click', e => { if (e.target === e.currentTarget) closeOv(); });

// ═══ INIT ═══
const saved = localStorage.getItem('bt');
if (saved) document.getElementById('tok').value = saved;
</script>
