    />
    <script>
      (function () {
        // 1. Force manual restoration as the very first thing
        if ("scrollRestoration" in history) {
          history.scrollRestoration = "manual";
        }

        const forceTop = () => {
          window.scrollTo(0, 0);
          if (document.documentElement) document.documentElement.scrollTop = 0;
          if (document.body) document.body.scrollTop = 0;
        };

        // Aggressive jump-to-top immediately
        forceTop();

        // 2. Clear any hash state
        if (window.location.hash) {
            window.history.replaceState(null, null, window.location.pathname + window.location.search);
        }

        // 3. Prevent any scrolling before we are fully ready
        const lock = (e) => {
          if (window.scrollY > 0) {
            forceTop();
            e.preventDefault();
          }
        };
        window.addEventListener('scroll', lock, { passive: false });

        // 4. Repeatedly jump every 20ms until load, then for 2 seconds more
        const interval = setInterval(forceTop, 20);

        window.addEventListener("load", () => {
          forceTop();
          
          // Show content after a small buffer
          setTimeout(() => {
            clearInterval(interval);
            window.removeEventListener('scroll', lock);
            document.documentElement.style.opacity = "1";
            
            // Re-enable smooth scroll only after everything is stable
            setTimeout(() => {
              document.documentElement.style.scrollBehavior = "smooth";
            }, 1000);
          }, 500);
        });

        // 5. Hard reset on pagehide (for back button and refresh)
        window.addEventListener("pagehide", forceTop);
      })();
    </script>
